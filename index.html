<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--sf:#f6f7f9;--tx:#14181f;--mu:#667085;--bd:#e6e8ec;--or:#ff7a00;--gr:#16a34a;--rd:#e5383b}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:var(--tx);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--bd)}
.hd{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.03em;cursor:pointer}.logo i{color:var(--or);font-style:normal}
.sr{flex:1;position:relative;display:block}
.sr input{width:100%;height:42px;border:1px solid var(--bd);border-radius:99px;background:var(--sf);padding:0 16px 0 40px;font:inherit;color:var(--tx)}
.sr span{position:absolute;left:14px;top:11px;color:var(--mu)}
.cb{position:relative;width:42px;height:42px;border:1px solid var(--bd);border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--tx)}
.cb b{position:absolute;top:-4px;right:-4px;background:var(--or);color:#1a1100;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:700;padding:0 4px}
main{max-width:1100px;margin:auto;padding:0 16px 24px}
.hero{margin-top:14px;border-radius:22px;min-height:440px;background:#20242b center 25%/cover no-repeat;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.74))}
.hin{position:relative;z-index:1;padding:24px;color:#fff;max-width:540px}
.hero h1{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.03em}
.hero p{margin:10px 0 18px;opacity:.92}
.cta{background:var(--or);color:#1a1100;font-weight:700;border:0;border-radius:99px;padding:13px 28px;font-size:15px}
@media(min-width:760px){.hero{min-height:500px}.hero h1{font-size:48px}}
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:760px){.trust{grid-template-columns:repeat(4,1fr)}}
.ti{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:14px;padding:12px}
.ti .ic{flex:none;width:38px;height:38px;border-radius:50%;background:#e8f7ef;color:var(--gr);display:grid;place-items:center}
.ti b{display:block;font-size:13px;line-height:1.25}.ti small{color:var(--mu);font-size:12px;line-height:1.3;display:block}
h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:22px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:99px;padding:8px 16px;font-size:14px;font-weight:500}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.row .card{flex:none;width:46%;max-width:240px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.im{aspect-ratio:1;background:var(--sf);position:relative}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.bd{position:absolute;left:8px;top:8px;background:var(--rd);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;font-style:normal}
.bd.g{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.ci{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-size:14px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:700;font-size:16px}.pr s{font-weight:400;font-size:12px;color:var(--mu);margin-left:4px}
.lo{font-size:12px;color:#b45309;font-weight:500}
.btn{background:var(--or);color:#1a1100;border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:700;width:100%;margin-top:auto}
.btn:disabled{background:var(--bd);color:var(--mu)}.btn.dk{background:var(--tx);color:#fff}.btn.ln{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.btn:focus-visible,.chip:focus-visible,.in:focus-visible,.key:focus-visible{outline:3px solid #ffb366;outline-offset:2px}
.mu{color:var(--mu);font-size:14px}
.in{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font:inherit;margin:5px 0}
textarea.in{min-height:76px}
footer{background:var(--sf);border-top:1px solid var(--bd);margin-top:28px}
.fg{max-width:1100px;margin:auto;padding:32px 16px 8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:26px}
.fg h4{font-size:14px;font-weight:700;margin-bottom:10px}
.fg p,.fl{display:block;font-size:14px;color:var(--mu);margin:0 0 7px;text-decoration:none;cursor:pointer}
.fg a.fl:hover{color:var(--tx)}
.soc{display:flex;gap:10px;margin-top:14px}
.soc a,.soc span{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:#fff;color:var(--tx);display:grid;place-items:center}
.soc .off{opacity:.4}
.fb{max-width:1100px;margin:auto;padding:16px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);margin-top:20px;font-size:13px;color:var(--mu)}
.key{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:#fff;font-size:18px}
.sheet{position:fixed;inset:0;background:rgba(15,23,32,.5);display:none;align-items:flex-end;z-index:40}.sheet.on{display:flex}
.box{background:#fff;width:100%;max-width:560px;margin:auto;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}
.box h3{font-size:20px;font-weight:700;margin-bottom:10px;letter-spacing:-.02em}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;border-radius:14px;scrollbar-width:none}
.gal img{flex:none;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:start;background:var(--sf)}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.th{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--sf);flex:none}.fx{flex:1;font-size:14px}
.q{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--tx);font-size:16px;margin:0 6px}
.tot{padding:12px 0;font-size:14px;line-height:1.8}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}#toast.on{opacity:1}
.adm{position:fixed;inset:0;background:#fff;z-index:30;overflow:auto;display:none}.adm.on{display:block}
.ab{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.ai{max-width:760px;margin:auto;padding:14px 16px 60px}
.ar{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:8px;margin:8px 0;font-size:13px}
.ar button{border:0;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;background:var(--sf);color:var(--tx)}
.ck{display:inline-flex;gap:6px;align-items:center;font-size:14px;margin:6px 14px 6px 0}
.tn{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.tn div{position:relative}.tn img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.tn button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--tx);color:#fff;font-size:12px}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
label.lb{display:block;font-size:13px;color:var(--mu);margin-top:8px}
</style></head>
<body>
<header><div class="hd"><div class="logo" id="lg" onclick="scrollTo(0,0)"></div>
<label class="sr"><span id="si"></span><input id="qi" placeholder="Search products" aria-label="Search products" oninput="q=this.value;fill()"></label>
<button class="cb" onclick="openCart()" aria-label="Open cart"><span id="bi"></span><b id="cc">0</b></button></div></header>
<main>
<section class="hero" id="hero"><div class="hin"><h1 id="hh"></h1><p id="hs"></p><button class="cta" onclick="$('shop').scrollIntoView()">Shop now</button></div></section>
<div class="trust" id="tr"></div>
<div class="chips" id="ch"></div>
<div id="fr"></div>
<h2 id="shop">All products</h2><div class="grid" id="gl"></div>
</main>
<footer id="ft"></footer>
<div class="sheet" id="sh" onclick="if(event.target==this)closeS()"><div class="box" id="box"></div></div>
<div class="adm" id="adm"></div>
<div id="toast"></div>

 return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${c}"/><g fill="none" stroke="#9aa4b2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(120 110)"><path d="M20 40h120l-12 120H32z"/><path d="M55 40a25 25 0 0150 0"/></g></svg>`)}
const SEED=[['Stainless steel water bottle',850,1100,'Home',14],['Fast charging phone cable',450,0,'Phones',30],['Cotton bed sheet set',1800,2400,'Home',9],['Non-stick frying pan',1500,0,'Kitchen',12],['LED desk lamp',1200,1500,'Home',3],['Everyday cotton t-shirt',700,0,'Fashion',25]]
 .map((r,i)=>({id:'s'+i,name:r[0],price:r[1],old:r[2],cat:r[3],stock:r[4],imgs:[],created:Date.now()-i*864e5,sample:true,desc:'Sample product. Add your own products from the admin panel.'}));

/* ===== DATA (catalog is one file in Firebase Storage; demo mode uses this browser) ===== */
const DS={name:'Atlas',tag:'Everyday essentials, delivered across Kenya.',hero:'Everyday essentials, delivered to your door',heroSub:'Shop things you use every day at fair prices. Pay with M-PESA or on delivery.',heroImg:'',delN:0,delO:300,phone:'',email:'',loc:'',hours:'',returns:'Wrong or faulty item? Message us within 48 hours and we will sort it out.',ig:'',fb:'',tt:'',wa:''};
let C={settings:{},products:[]},cart=[],cat='All',q='',editId=null,eImgs=[],tab='p';
let isAdmin=false;try{isAdmin=sessionStorage.getItem('atlas_admin')=='1';cart=JSON.parse(localStorage.getItem('atlas_cart')||'[]');C=JSON.parse(localStorage.getItem('atlas_cache')||'null')||C}catch(e){}
const S=()=>({...DS,...(C.settings||{})});
const items=()=>C.products.length?C.products:SEED;
const vis=()=>items().filter(p=>!p.hidden);
const pimg=(p,i)=>(p.imgs&&p.imgs[0])||ph(i||0);
async function loadCatalog(){
 try{
  if(DEMO){const t=localStorage.getItem('atlas_demo');if(t)C=JSON.parse(t);return}
  const u=await st.ref('atlas/catalog.js').getDownloadURL();
  window.ATLAS_CATALOG=null;
  await new Promise((ok,no)=>{const s=document.createElement('script');s.src=u+(u.indexOf('?')>-1?'&':'?')+'t='+Date.now();s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  if(window.ATLAS_CATALOG)C=window.ATLAS_CATALOG;
  try{localStorage.setItem('atlas_cache',JSON.stringify(C))}catch(e){}
 }catch(e){}
}
async function publish(){
 C.settings=C.settings||{};
 if(DEMO){localStorage.setItem('atlas_demo',JSON.stringify(C));return}
 await st.ref('atlas/catalog.js').putString('window.ATLAS_CATALOG='+JSON.stringify(C)+';','raw',{contentType:'application/javascript',cacheControl:'no-cache, max-age=0'});
 try{localStorage.setItem('atlas_cache',JSON.stringify(C))}catch(e){}
}
function shrink(f,w){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.82)};i.src=URL.createObjectURL(f)})}
async function saveImg(f,w){
 const b=await shrink(f,w||900);
 if(DEMO)return new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(b)});
 const ref=st.ref('atlas/img/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg');
 await ref.put(b,{contentType:'image/jpeg',cacheControl:'public,max-age=31536000'});
 return ref.getDownloadURL();
}

/* ===== FEATURED ALGORITHM ===== */
function score(p){
 const age=(Date.now()-(p.created||0))/864e5;
 const fresh=Math.pow(.5,age/14)*50;                              // new uploads rise, then fade over ~2 weeks
 const deal=p.old>p.price?(1-p.price/p.old)*100:0;                 // bigger discount ranks higher
 const stock=p.stock<=0?-1e4:(p.stock<=5?10:0);                    // sold out sinks, low stock gets urgency
 return fresh+deal+stock+(p.featured?40:0);                        // admin "Boost"
}
function featured(){
 const v=vis().filter(p=>p.stock>0);
 const pins=v.filter(p=>p.pinned).sort((a,b)=>(a.pin||99)-(b.pin||99));
 return pins.concat(v.filter(p=>!p.pinned).sort((a,b)=>score(b)-score(a))).slice(0,8);
}

/* ===== STOREFRONT ===== */
function card(p){
 const d=p.old>p.price?Math.round((1-p.price/p.old)*100):0;
 return `<div class="card" onclick="openP('${p.id}')"><div class="im"><img loading="lazy" alt="${esc(p.name)}" src="${esc(pimg(p,+String(p.id).replace(/\D/g,'')))}">${p.stock<=0?'<i class="bd g">Sold out</i>':d?`<i class="bd">-${d}%</i>`:p.sample?'<i class="bd g">Sample</i>':''}</div><div class="ci"><div class="nm">${esc(p.name)}</div><div class="pr">${money(p.price)}${d?`<s>${money(p.old)}</s>`:''}</div>${p.stock>0&&p.stock<=5?`<div class="lo">Only ${p.stock} left</div>`:''}<button class="btn" style="margin-top:6px" ${p.stock<=0?'disabled':''} onclick="event.stopPropagation();add('${p.id}')">Add to cart</button></div></div>`;
}
function setCat(c){cat=c;fill()}
function fill(){
 const cats=['All',...new Set(vis().map(p=>p.cat).filter(Boolean))];
 $('ch').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${esc(c)}" onclick="setCat(this.dataset.c)">${esc(c)}</button>`).join('');
 const l=vis().filter(p=>(cat=='All'||p.cat==cat)&&(!q||(p.name+' '+(p.cat||'')).toLowerCase().includes(q.toLowerCase())));
 const f=(!q&&cat=='All')?featured():[];
 $('fr').innerHTML=f.length?`<h2>Top picks</h2><div class="row">${f.map(card).join('')}</div>`:'';
 $('gl').innerHTML=l.map(card).join('')||'<p class="mu">Nothing matches that search. Try another word or category.</p>';
}
function render(){
 const s=S();
 $('lg').innerHTML=esc(s.name)+'<i>.</i>';document.title=s.name;
 $('hh').textContent=s.hero;$('hs').textContent=s.heroSub;
 $('hero').style.backgroundImage='url("'+String(s.heroImg||HERO).replace(/["')]/g,'')+'")';
 const T=[['shield','Secure checkout','M-PESA or pay on delivery'],['truck','Delivery across Kenya',+s.delO>0?money(s.delO)+' outside Nairobi':'Free delivery'],['ret','Easy returns','See our returns policy'],['chat','Order support','Chat with us on WhatsApp']];
 $('tr').innerHTML=T.map(t=>`<div class="ti"><span class="ic">${ic(t[0])}</span><div><b>${t[1]}</b><small>${t[2]}</small></div></div>`).join('');
 fill();foot();
}
function foot(){
 const s=S(),wa=String(s.wa||CFG.whatsapp||'').replace(/\D/g,''),cats=[...new Set(vis().map(p=>p.cat).filter(Boolean))];
 const soc=[['ig',s.ig],['fb',s.fb],['tt',s.tt],['chat',wa?'https://wa.me/'+wa:'']];
 $('ft').innerHTML=`<div class="fg"><div><div class="logo">${esc(s.name)}<i>.</i></div><p style="margin-top:8px">${esc(s.tag)}</p><div class="soc">${soc.map(x=>x[1]?`<a href="${esc(x[1])}" target="_blank" rel="noopener" aria-label="${x[0]}">${ic(x[0])}</a>`:`<span class="off">${ic(x[0])}</span>`).join('')}</div></div>
 <div><h4>Shop</h4>${cats.map(c=>`<a class="fl" data-c="${esc(c)}" onclick="setCat(this.dataset.c);$('shop').scrollIntoView()">${esc(c)}</a>`).join('')||'<p>All products</p>'}</div>
 <div><h4>Customer care</h4><p>Delivery: ${+s.delN>0?money(s.delN):'free'} in Nairobi, ${+s.delO>0?money(s.delO):'free'} outside Nairobi.</p><p>Payment: M-PESA or cash on delivery.</p><p>Returns: ${esc(s.returns)}</p></div>
 <div><h4>Contact</h4>${wa?`<a class="fl" href="https://wa.me/${wa}" target="_blank" rel="noopener">Chat on WhatsApp</a>`:''}${s.phone?`<a class="fl" href="tel:${esc(s.phone)}">${esc(s.phone)}</a>`:''}${s.email?`<a class="fl" href="mailto:${esc(s.email)}">${esc(s.email)}</a>`:''}${s.loc?`<p>${esc(s.loc)}</p>`:''}${s.hours?`<p>${esc(s.hours)}</p>`:''}</div></div>
 <div class="fb"><span>© ${new Date().getFullYear()} ${esc(s.name)}. All rights reserved.</span><button class="key" onclick="adminOpen()" aria-label="Admin login">🔐</button></div>`;
}
function openP(id){
 const p=items().find(x=>x.id==id);if(!p)return;
 const d=p.old>p.price?Math.round((1-p.price/p.old)*100):0,n=+String(p.id).replace(/\D/g,'');
 sheet(`<div class="gal">${(p.imgs&&p.imgs.length?p.imgs:[ph(n)]).map(u=>`<img alt="${esc(p.name)}" src="${esc(u)}">`).join('')}</div><h3 style="margin-top:14px">${esc(p.name)}</h3><div class="pr" style="font-size:22px">${money(p.price)}${d?`<s>${money(p.old)}</s> <i class="bd" style="position:static">-${d}%</i>`:''}</div><p class="mu" style="margin:10px 0;white-space:pre-wrap">${esc(p.desc||'')}</p><p class="mu" style="color:${p.stock>0?'var(--gr)':'var(--rd)'}">${p.stock<=0?'Sold out':p.stock<=5?'Only '+p.stock+' left':'In stock'}</p><button class="btn" style="margin-top:12px" ${p.stock<=0?'disabled':''} onclick="add('${p.id}');closeS()">Add to cart</button>`);
}
function saveCart(){try{localStorage.setItem('atlas_cart',JSON.stringify(cart))}catch(e){}$('cc').textContent=cart.reduce((a,c)=>a+c.q,0)}
function add(id){const p=items().find(x=>x.id==id);if(!p||p.stock<=0)return;const c=cart.find(x=>x.id==id);if(c){if(c.q<p.stock)c.q++}else cart.push({id,q:1});saveCart();toast('Added to cart')}
function qty(id,d){const c=cart.find(x=>x.id==id);if(!c)return;c.q+=d;if(c.q<1)cart=cart.filter(x=>x.id!=id);saveCart();openCart()}
const lines=()=>cart.map(c=>({c,p:items().find(x=>x.id==c.id)})).filter(x=>x.p);
function openCart(){
 const it=lines(),sub=it.reduce((a,x)=>a+x.p.price*x.c.q,0);
 sheet(`<h3>Your cart</h3>${it.map(x=>`<div class="li"><img class="th" alt="" src="${esc(pimg(x.p,+String(x.p.id).replace(/\D/g,'')))}"><div class="fx"><b>${esc(x.p.name)}</b><div>${money(x.p.price)}</div></div><button class="q" onclick="qty('${x.p.id}',-1)">−</button>${x.c.q}<button class="q" onclick="qty('${x.p.id}',1)">+</button></div>`).join('')||'<p class="mu">Your cart is empty. Add something from the store.</p>'}${it.length?`<div class="tot">Subtotal <b>${money(sub)}</b></div><button class="btn" onclick="checkout()">Checkout</button>`:''}`);
}
function calc(){const s=S(),sub=lines().reduce((a,x)=>a+x.p.price*x.c.q,0),fee=$('cz')&&$('cz').value=='o'?+s.delO:+s.delN;return{sub,fee,total:sub+fee}}
function fee(){const t=calc();$('tt').innerHTML=`Subtotal ${money(t.sub)}<br>Delivery ${t.fee?money(t.fee):'Free'}<br><b style="font-size:17px">Total ${money(t.total)}</b>`}
function checkout(){
 sheet(`<h3>Checkout</h3><input class="in" id="cn" placeholder="Full name" autocomplete="name"><input class="in" id="cp" placeholder="Phone (2547...)" inputmode="tel" autocomplete="tel"><select class="in" id="cz" onchange="fee()"><option value="n">Delivery inside Nairobi</option><option value="o">Delivery outside Nairobi</option></select><input class="in" id="ca" placeholder="Town, area and landmark"><select class="in" id="cy"><option>M-PESA</option><option>Cash on delivery</option></select><div class="tot" id="tt"></div><button class="btn" onclick="place()">Send order on WhatsApp</button>`);fee();
}
function place(){
 const s=S(),wa=String(s.wa||CFG.whatsapp||'').replace(/\D/g,''),t=calc(),n=$('cn').value.trim(),ph=$('cp').value.replace(/\D/g,''),a=$('ca').value.trim();
 if(!n||ph.length<9||!a){toast('Enter your name, phone and delivery area');return}
 if(!wa){toast('This store has not set up ordering yet. Please try again later.');return}
 const ref=Math.random().toString(36).slice(2,8).toUpperCase(),pay=$('cy').value;
 const msg=`New order ${ref}\n`+lines().map(x=>x.c.q+' x '+x.p.name+' ('+money(x.p.price)+')').join('\n')+`\nSubtotal ${money(t.sub)}\nDelivery ${money(t.fee)}\nTotal ${money(t.total)}\nPayment: ${pay}\nName: ${n}\nPhone: ${ph}\nArea: ${a}`;
 if(pay=='M-PESA'&&CFG.mpesaWorker){fetch(CFG.mpesaWorker,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph,amount:t.total,ref})}).catch(()=>{})}
 window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank');
 cart=[];saveCart();
 sheet(`<h3>Order sent</h3><p class="mu" style="margin:8px 0 14px">Your order reference is <b>${ref}</b>. Finish the order in the WhatsApp chat that just opened, and we will confirm delivery there.</p><button class="btn" onclick="closeS()">Done</button>`);
}

/* ===== ADMIN (password gate, opened with the key in the footer) ===== */
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function adminOpen(){
 if(isAdmin){openAdmin();return}
 sheet(`<h3>Admin login</h3><input class="in" id="pw" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')login()"><button class="btn" style="margin-top:8px" onclick="login()">Log in</button>`);
 setTimeout(()=>$('pw')&&$('pw').focus(),60);
}
async function login(){
 if(await sha($('pw').value)===ADMIN_HASH){isAdmin=true;try{sessionStorage.setItem('atlas_admin','1')}catch(e){}closeS();openAdmin()}else toast('Wrong password')
}
function logout(){isAdmin=false;try{sessionStorage.removeItem('atlas_admin')}catch(e){}$('adm').classList.remove('on')}
function openAdmin(){$('adm').classList.add('on');admin()}
function admin(){
 const t=(k,l)=>`<button class="chip ${tab==k?'on':''}" onclick="tab='${k}';admin()">${l}</button>`;
 $('adm').innerHTML=`<div class="ab"><span>Admin</span><span><button class="chip" onclick="logout()">Log out</button> <button class="chip" onclick="$('adm').classList.remove('on')">Close</button></span></div><div class="ai">${DEMO?'<div class="note">Demo mode: changes save in this browser only. Add your Firebase details in CFG to publish for shoppers.</div>':''}<div class="chips">${t('p','Products')}${t('s','Site settings')}</div><div id="at"></div></div>`;
 (tab=='p'?aProd:aSet)();
}
function thumbs(){$('tn').innerHTML=eImgs.map((u,i)=>`<div><img alt="" src="${esc(u)}"><button onclick="eImgs.splice(${i},1);thumbs()" aria-label="Remove image">×</button></div>`).join('')}
function aProd(){
 eImgs=[];editId=null;
 $('at').innerHTML=`<h3 id="ft2" style="margin:14px 0 4px;font-size:18px">Add product</h3><input class="in" id="pn" placeholder="Product name"><div style="display:flex;gap:8px"><input class="in" id="pp" type="number" placeholder="Price (KSh)"><input class="in" id="po" type="number" placeholder="Old price (optional)"></div><div style="display:flex;gap:8px"><input class="in" id="pc" placeholder="Category"><input class="in" id="ps" type="number" placeholder="Stock"></div><textarea class="in" id="pd" placeholder="Description"></textarea><label class="lb">Photos (resized automatically)</label><div class="tn" id="tn"></div><input class="in" id="pf" type="file" accept="image/*" multiple onchange="addImgs(this)"><div><label class="ck"><input type="checkbox" id="pb">Boost in Top picks</label><label class="ck"><input type="checkbox" id="pk">Pin to top</label><label class="ck"><input type="checkbox" id="ph">Hide</label></div><input class="in" id="pq" type="number" placeholder="Pin position (1 is first)"><button class="btn" onclick="saveP()">Save and publish</button><h3 style="margin:22px 0 4px;font-size:18px">Your products (${C.products.length})</h3><div id="pl"></div>`;
 $('pl').innerHTML=C.products.slice().sort((a,b)=>(b.created||0)-(a.created||0)).map(p=>`<div class="ar"><img class="th" style="width:44px;height:44px" alt="" src="${esc(pimg(p))}"><div class="fx"><b>${esc(p.name)}</b><br>${money(p.price)} · stock ${p.stock}${p.pinned?' · pinned':''}${p.hidden?' · hidden':''}</div><button onclick="editP('${p.id}')">Edit</button><button onclick="delP('${p.id}')">Delete</button></div>`).join('')||'<p class="mu">Shoppers currently see sample products. Your first saved product replaces them.</p>';
}
async function addImgs(el){
 toast('Uploading photos...');
 try{for(const f of el.files)eImgs.push(await saveImg(f,900));thumbs();toast('Photos added')}catch(e){toast('Upload failed. Check your Firebase details and Storage rules.')}
 el.value='';
}
function editP(id){
 const p=C.products.find(x=>x.id==id);editId=id;eImgs=(p.imgs||[]).slice();
 $('ft2').textContent='Edit product';$('pn').value=p.name;$('pp').value=p.price;$('po').value=p.old||'';$('pc').value=p.cat||'';$('ps').value=p.stock;$('pd').value=p.desc||'';$('pb').checked=!!p.featured;$('pk').checked=!!p.pinned;$('ph').checked=!!p.hidden;$('pq').value=p.pin||'';thumbs();
 $('adm').scrollTo({top:0,behavior:'smooth'});
}
async function saveP(){
 const d={name:$('pn').value.trim(),price:+$('pp').value,old:+$('po').value||0,cat:$('pc').value.trim(),stock:+$('ps').value||0,desc:$('pd').value.trim(),imgs:eImgs,featured:$('pb').checked,pinned:$('pk').checked,pin:+$('pq').value||99,hidden:$('ph').checked};
 if(!d.name||!d.price){toast('Name and price are required');return}
 if(editId){const i=C.products.findIndex(p=>p.id==editId);C.products[i]={...C.products[i],...d}}
 else{d.id='p'+Date.now().toString(36);d.created=Date.now();C.products.push(d)}
 try{await publish();toast('Published');render();aProd()}catch(e){toast('Publish failed. Check Storage rules and your Firebase details.')}
}
async function delP(id){
 if(!confirm('Delete this product?'))return;
 C.products=C.products.filter(p=>p.id!=id);
 try{await publish();render();aProd()}catch(e){toast('Delete failed')}
}
const SF=[['name','Store name'],['tag','Short tagline (footer)'],['hero','Welcome headline'],['heroSub','Welcome message'],['delN','Delivery fee inside Nairobi (KSh)'],['delO','Delivery fee outside Nairobi (KSh)'],['wa','WhatsApp number (2547...)'],['phone','Phone'],['email','Email'],['loc','Location'],['hours','Opening hours'],['returns','Returns policy'],['ig','Instagram link'],['fb','Facebook link'],['tt','TikTok link']];
function aSet(){
 const s=S();
 $('at').innerHTML=`<h3 style="margin:14px 0 4px;font-size:18px">Welcome photo</h3><p class="mu">Shown at the top of the store. Change it whenever trends change.</p><img alt="" src="${esc(s.heroImg||HERO)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin:8px 0"><input class="in" id="sf" type="file" accept="image/*"><button class="btn ln" style="margin-top:6px" onclick="resetHero()">Use the default photo</button><h3 style="margin:22px 0 4px;font-size:18px">Store details</h3>`+SF.map(f=>`<label class="lb">${f[1]}</label><input class="in" id="s_${f[0]}" value="${esc(s[f[0]])}">`).join('')+`<button class="btn" style="margin-top:12px" onclick="saveS()">Save and publish</button>`;
}
async function saveS(){
 const n={...(C.settings||{})};
 SF.forEach(f=>{const v=$('s_'+f[0]).value.trim();n[f[0]]=(f[0]=='delN'||f[0]=='delO')?(+v||0):v});
 try{
  if($('sf').files.length){toast('Uploading photo...');n.heroImg=await saveImg($('sf').files[0],1200)}
  C.settings=n;await publish();render();toast('Published');aSet();
 }catch(e){toast('Publish failed. Check Storage rules and your Firebase details.')}
}
async function resetHero(){C.settings={...(C.settings||{}),heroImg:''};try{await publish();render();aSet()}catch(e){toast('Could not reset')}}

/* ===== BOOT ===== */
$('si').innerHTML=ic('search',18);$('bi').innerHTML=ic('bag',20);
saveCart();render();
loadCatalog().then(()=>{render();saveCart()});
if(location.hash=='#admin')adminOpen();
</script>
</body></html>
